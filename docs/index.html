<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z’Estell-IA</title>
  <style>
    :root {
      --bg: #f3f7fb;
      --ink: #16324f;
      --muted: #5f7387;
      --line: #d9e3ee;
      --accent: #2563eb;
      --accent-2: #0f9d58;
      --danger: #c2410c;
      --plum: #16324f;
      --shadow: 0 14px 34px rgba(22, 50, 79, 0.10);
      --radius: 14px;
      font-family: "Avenir Next", Avenir, "Gill Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 0%, #ffffff 0%, transparent 32%),
        linear-gradient(135deg, #ffffff 0%, #f3f7fb 54%, #e8eef7 100%);
      color: var(--ink);
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 12px 0 32px;
      display: grid;
      gap: 20px;
    }

    .app-header {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 0;
      text-align: center;
    }

    .app-name {
      margin: 0;
      color: var(--plum);
      font-size: 1.15rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .card {
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(217, 227, 238, 0.94);
      box-shadow: var(--shadow);
      border-radius: 10px;
      padding: 18px;
    }

    .screen {
      min-height: 360px;
      display: grid;
      gap: 16px;
    }

    .status {
      min-height: 24px;
      color: var(--danger);
      font-size: 0.95rem;
    }

    .message {
      padding: 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
      border: 1px solid var(--line);
      min-height: 110px;
    }

    .message h2,
    .message p {
      margin: 0;
    }

    .message h2 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .message .final {
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message .current {
      margin-top: 10px;
      color: var(--accent);
      font-weight: 800;
      font-size: clamp(1.15rem, 2vw, 1.6rem);
    }

    .proposal {
      display: grid;
      gap: 8px;
      padding: 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb 0%, #163f9b 100%);
      color: white;
    }

    .proposal.secondary {
      background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .proposal .small {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .proposal.secondary .small {
      color: var(--muted);
    }

    .proposal .big {
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      font-weight: 800;
      word-break: break-word;
    }

    .proposal .hint {
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.45;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .word-option {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, opacity 120ms ease;
    }

    .word-option:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: #eef5ff;
      opacity: 0.96;
    }

    .word-option:disabled {
      cursor: default;
      opacity: 0.5;
      transform: none;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .actions .full {
      grid-column: 1 / -1;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 14px 16px;
      min-height: 52px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 140ms ease, opacity 140ms ease, background 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: 0.55; transform: none; }

    .yes { background: var(--accent-2); color: white; }
    .no { background: #d9776a; color: white; }
    .ghost { background: #eaf1fb; color: var(--ink); }
    .danger { background: #fee2e2; color: #991b1b; }
    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      border-radius: 14px;
      padding: 12px 14px;
    }

    input:focus {
      outline: 3px solid rgba(189, 111, 104, 0.18);
      border-color: var(--accent);
    }

    @media (max-width: 960px) {
      .screen { min-height: unset; }
    }

    @media (max-width: 720px) {
      .app-header { width: min(100% - 20px, 1180px); padding-top: 10px; }
      .app-name { font-size: 1.05rem; }
      main { width: min(100% - 20px, 1180px); padding-top: 10px; }
      .card { padding: 14px; }
      .screen { gap: 12px; }
      .proposal, .message { padding: 14px; }
      .proposal .big { font-size: clamp(2.1rem, 12vw, 3.2rem); }
      .word-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .actions { grid-template-columns: 1fr 1fr; }
      button { min-height: 56px; }
    }

    @media (max-width: 480px) {
      .proposal .big { font-size: clamp(2.3rem, 18vw, 3rem); }
      .message .final { font-size: clamp(1.3rem, 8vw, 2rem); }
      .message .current { font-size: clamp(1rem, 6vw, 1.5rem); }
      button { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-name">Z’Estell-IA</h1>
  </header>
  <main>
    <section class="card screen" aria-labelledby="screen-title">
        <div class="message" aria-live="polite">
          <h2 id="screen-title">Message en cours</h2>
          <div class="final" id="final-text">—</div>
          <div class="current" id="current-word">Mot en cours : —</div>
        </div>

        <div class="field">
          <label for="manual-word-input">Compléter le mot en cours</label>
          <input
            id="manual-word-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="Tapez ou complétez le mot"
            aria-label="Compléter le mot en cours"
          >
        </div>

        <div class="proposal">
          <div class="small">Proposition actuelle</div>
          <div class="big" id="proposal-text">Clique sur “Nouvelle phrase”</div>
          <div class="hint" id="proposal-hint">Valide la proposition avec Oui pour continuer.</div>
        </div>

        <div class="proposal secondary">
          <div class="small">Mots probables</div>
          <div class="word-grid" id="probable-words"></div>
        </div>

        <div class="actions">
          <button class="yes" id="yes-button">Oui</button>
          <button class="no" id="no-button">Non</button>
          <button class="ghost" id="validate-word-button">Valider le mot</button>
          <button class="ghost" id="undo-button">Lettre précédente</button>
          <button class="ghost full" id="new-button">Nouvelle phrase</button>
          <button class="danger full" id="delete-button">Supprimer le dernier caractère</button>
        </div>

        <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>

      const wordInAllowedSet = allowedNextWords.includes(normalizedWord);
      const lastWordUsesVerbPattern = ['VEUX', 'PEUX', 'DOIS', 'VEUT', 'PEUT'].includes(lastWord);

      if (!previousWords.length) {
        if (type === 'subject') return 300 + templateBoost;
        if (type === 'verb') return 80 + templateBoost;
        if (type === 'complement') return 30 + templateBoost;
      }

      if (type === 'subject') {
        if (!lastWord) return 200 + templateBoost;
        return 60 + templateBoost;
      }

      if (type === 'verb') {
        if (SUBJECTS.includes(lastWord)) return 260 + templateBoost;
        if (lastWordUsesVerbPattern) return 300 + templateBoost;
        if (VERBS.includes(lastWord)) return 70 + templateBoost;
        return 20 + templateBoost;
      }

      if (type === 'complement') {
        if (lastWordUsesVerbPattern) return wordInAllowedSet ? 180 : -140 + templateBoost;
        if (VERBS.includes(lastWord)) return 260 + templateBoost;
        if (SUBJECTS.includes(lastWord)) return 60 + templateBoost;
        return 30 + templateBoost;
      }

      return templateBoost;
    }

    function getExpectedWordType() {
      const previousWords = getWordContext();
      const lastWord = previousWords[previousWords.length - 1] || '';

      if (!previousWords.length) return 'subject';
      if (SUBJECTS.includes(lastWord)) return 'verb';
      if (NATURAL_NEXT_WORDS_BY_LAST_WORD[lastWord] && NATURAL_NEXT_WORDS_BY_LAST_WORD[lastWord].some((word) => VERBS.includes(word))) return 'verb';
      if (VERBS.includes(lastWord)) {
        if (['VEUX', 'PEUX', 'DOIS', 'VEUT', 'PEUT'].includes(lastWord)) return 'verb';
        return 'complement';
      }
      if (COMPLEMENTS.includes(lastWord)) return 'subject';
      return 'subject';
    }

    function expectedTypeBonus(type) {
      const expected = getExpectedWordType();
      const previousWords = getWordContext();
      const lastWord = previousWords[previousWords.length - 1] || '';
      const allowedNextWords = NATURAL_NEXT_WORDS_BY_LAST_WORD[lastWord] || [];

      if (type === expected) return 220;
      if (allowedNextWords.length && type === 'complement' && lastWord && allowedNextWords.some((candidate) => candidate === 'ALLER' || candidate === 'DORMIR' || candidate === 'MANGER')) {
        return -160;
      }
      if (expected === 'verb' && type === 'subject') return -100;
      if (expected === 'complement' && type === 'subject') return -80;
      if (expected === 'subject' && type === 'verb') return -40;
      return 0;
    }

    function getWordContext() {
      return (state.finalizedText || '')
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map((word) => stripAccents(word));
    }

    function getNaturalWordList() {
      const previousWords = getWordContext();
      const sequence = previousWords.slice(-2).join(' ');
      return NATURAL_WORDS_BY_SEQUENCE[sequence]
        || NATURAL_NEXT_WORDS_BY_LAST_WORD[previousWords[previousWords.length - 1]]
        || NATURAL_WORDS_BY_SEQUENCE[''];
    }

    function getContextWordEntries(prefix) {
      const normalizedPrefix = stripAccents(prefix || '');
      const naturalWords = getNaturalWordList();
      const contextualEntries = buildLexicon().filter((entry) => {
        return naturalWords.includes(entry.normalized)
          && entry.normalized.startsWith(normalizedPrefix);
      });

      if (contextualEntries.length || !normalizedPrefix) return contextualEntries;
      return buildLexicon().filter((entry) => entry.normalized.startsWith(normalizedPrefix));
    }

    function getLetterSuggestions() {
      const prefix = stripAccents(state.currentWord);
      const contextualMatches = getContextWordEntries(prefix);
      const globalMatches = buildLexicon().filter((entry) => entry.normalized.startsWith(prefix));
      const nextLetters = new Map();

      function addLetterWeights(entries, contextBonus = 0) {
        entries.forEach((entry) => {
          const remainder = entry.normalized.slice(prefix.length);
          if (!remainder) return;
          const letter = remainder[0];
          const type = entry.type || inferWordType(entry.word);
          const weight = (Number(entry.frequency) || 1) + grammarContextScore(entry) + expectedTypeBonus(type) + contextBonus;
          nextLetters.set(letter, (nextLetters.get(letter) || 0) + weight);
        });
      }

      addLetterWeights(globalMatches);
      addLetterWeights(contextualMatches, 220);

      const rankedLetters = [...nextLetters.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([letter]) => letter);

      const orderedLetters = [...new Set([...rankedLetters, ...LETTERS])];

      return orderedLetters.map((letter) => ({
        type: 'letter',
        value: letter,
        label: letter
      }));
    }

    function scoreWord(entry) {
      const type = entry.type || inferWordType(entry.word);
      return (Number(entry.frequency) || 1) + grammarContextScore(entry) + expectedTypeBonus(type);
    }

    function sortLikelyWords(prefix) {
      const normalizedPrefix = stripAccents(prefix || '');
      const naturalWords = getNaturalWordList();
      const matches = normalizedPrefix
        ? buildLexicon().filter((entry) => entry.normalized.startsWith(normalizedPrefix))
        : buildLexicon();

      return matches
        .filter((entry) => naturalWords.includes(entry.normalized))
        .map((entry) => ({
          ...entry,
          score: scoreWord(entry) + (naturalWords.length - naturalWords.indexOf(entry.normalized)) * 100
        }))
        .sort((a, b) => b.score - a.score || b.frequency - a.frequency || a.word.length - b.word.length);
    }

    function refreshCandidates() {
      const letterCandidates = getLetterSuggestions();
      state.candidates = letterCandidates;

      if (state.candidateIndex >= state.candidates.length) {
        state.candidateIndex = 0;
      }

      if (!state.candidates.length) {
        state.candidates = [{ type: 'command', value: 'reset', label: 'Nouvelle phrase' }];
      }
    }

    function getCurrentCandidate() {
      return state.candidates[state.candidateIndex] || null;
    }

    function snapshotState() {
      return {
        finalizedText: state.finalizedText,
        currentWord: state.currentWord,
        lastValidatedWord: state.lastValidatedWord,
        candidateIndex: state.candidateIndex,
        candidates: [...state.candidates]
      };
    }

    function pushHistory() {
      state.history.push(snapshotState());
      if (state.history.length > 40) {
        state.history.shift();
      }
    }

    function undoLastAction() {
      if (!state.history.length) {
        renderStatus('Aucune proposition précédente.');
        return;
      }

      const previous = state.history.pop();
      Object.assign(state, previous);
      state.candidates = Array.isArray(previous.candidates) ? previous.candidates.slice() : [];
      if (!state.candidates.length) {
        refreshCandidates();
      }
      render();
      renderStatus('Retour à la proposition précédente.');
    }

    function commitWord() {
      const word = state.currentWord.trim();
      if (!word) return;
      pushHistory();
      const previousText = state.finalizedText.trimEnd();
      state.finalizedText = previousText ? `${previousText} ${word} ` : `${word} `;
      state.lastValidatedWord = word;
      state.currentWord = '';
      state.candidateIndex = 0;
      refreshCandidates();
      render();
    }

    function validateWord() {
      if (!state.currentWord.trim()) {
        renderStatus('Commence un mot avant de le valider.');
        return;
      }
      commitWord();
    }

    function acceptCandidate(candidate) {
      if (!candidate) return;

      if (candidate.type === 'letter') {
        pushHistory();
        state.currentWord += candidate.value;
        state.candidateIndex = 0;
        refreshCandidates();
        render();
        return;
      }

      if (candidate.value === 'validate') {
        validateWord();
        return;
      }

      if (candidate.value === 'reset') {
        startNewPhrase();
      }
    }

    function rejectCandidate() {
      pushHistory();
      state.candidateIndex += 1;
      if (state.candidateIndex >= state.candidates.length) {
        state.candidateIndex = 0;
        state.candidates = getLetterSuggestions();
      }
      render();
    }

    function deleteLastCharacter() {
      if (!state.currentWord && !state.finalizedText) {
        renderStatus('Rien à supprimer.');
        return;
      }

      pushHistory();

      if (state.currentWord) {
        state.currentWord = state.currentWord.slice(0, -1);
        state.candidateIndex = 0;
        refreshCandidates();
        render();
        return;
      }

      state.finalizedText = state.finalizedText.trimEnd();
      if (!state.finalizedText) {
        renderStatus('Rien à supprimer.');
        return;
      }
      state.finalizedText = state.finalizedText.slice(0, -1).trimEnd();
      state.candidateIndex = 0;
      state.lastValidatedWord = state.finalizedText.split(/\s+/).filter(Boolean).slice(-1)[0] || '';
      refreshCandidates();
      render();
    }

    function startNewPhrase() {
      state.finalizedText = '';
      state.currentWord = '';
      state.lastValidatedWord = '';
      state.candidateIndex = 0;
      state.history = [];
      refreshCandidates();
      render();
    }

    function renderStatus(message) {
      els.status.textContent = message || '';
    }

    function renderLikelyWords() {
      const words = sortLikelyWords(state.currentWord).slice(0, 4);

      els.probableWords.innerHTML = '';

      if (!words.length) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'word-option';
        button.textContent = '—';
        button.disabled = true;
        els.probableWords.appendChild(button);
        return;
      }

      words.forEach((entry) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'word-option';
        button.textContent = entry.word;
        button.addEventListener('click', () => {
          state.currentWord = entry.word;
          render();
          commitWord();
        });
        els.probableWords.appendChild(button);
      });
    }

    function normalizeManualInput(value) {
      return stripAccents(value || '').replace(/[^A-Z]/g, '').slice(0, 20);
    }

    function render() {
      refreshCandidates();
      const candidate = getCurrentCandidate();

      els.finalText.textContent = state.finalizedText || '—';
      if (state.currentWord) {
        els.currentWord.textContent = state.lastValidatedWord
          ? `Mot validé : ${state.lastValidatedWord} · Mot en cours : ${state.currentWord}`
          : `Mot en cours : ${state.currentWord}`;
      } else if (state.lastValidatedWord) {
        els.currentWord.textContent = `Mot validé : ${state.lastValidatedWord}`;
      } else {
        els.currentWord.textContent = 'Mot en cours : —';
      }
      els.proposalText.textContent = candidate ? candidate.label : '—';
      els.manualWordInput.value = state.currentWord;

      els.proposalHint.textContent = state.currentWord
        ? 'Tu peux continuer lettre par lettre ou choisir un mot probable.'
        : 'Valide avec Oui pour accepter la lettre proposée.';

      els.validateWordButton.disabled = !state.currentWord.trim();

      renderLikelyWords();
      renderStatus('');
    }

    function wireEvents() {
      els.yesButton.addEventListener('click', () => acceptCandidate(getCurrentCandidate()));
      els.noButton.addEventListener('click', rejectCandidate);
      els.validateWordButton.addEventListener('click', validateWord);
      els.undoButton.addEventListener('click', undoLastAction);
      els.newButton.addEventListener('click', startNewPhrase);
      els.deleteButton.addEventListener('click', deleteLastCharacter);
      els.manualWordInput.addEventListener('input', (event) => {
        state.currentWord = normalizeManualInput(event.target.value);
        state.candidateIndex = 0;
        refreshCandidates();
        render();
      });
      els.manualWordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && state.currentWord.trim()) {
          event.preventDefault();
          validateWord();
        }
      });
      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
          event.preventDefault();
          undoLastAction();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          if (state.currentWord.trim()) {
            validateWord();
          } else {
            acceptCandidate(getCurrentCandidate());
          }
        } else if (event.key.toLowerCase() === 'y') {
          acceptCandidate(getCurrentCandidate());
        } else if (event.key.toLowerCase() === 'n' || event.key === ' ') {
          rejectCandidate();
        } else if (event.key === 'Backspace') {
          deleteLastCharacter();
        }
      });
    }
    function init() {
      wireEvents();
      refreshCandidates();
      render();
    }

    init();
  </script>
</body>
</html>
